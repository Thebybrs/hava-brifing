<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0E14" />
    <title>Çevrimdışı — Hava Brifing</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #0a0e14;
        color: #e6edf5;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .panel {
        background-color: #111823;
        border: 1px solid #243246;
        border-left: 3px solid #ffb000;
        border-radius: 0.375rem;
        max-width: 26rem;
        width: 100%;
        padding: 1.5rem;
        text-align: center;
      }
      .badge {
        display: inline-block;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #ffb000;
        background: rgba(255, 176, 0, 0.1);
        border: 1px solid rgba(255, 176, 0, 0.35);
        border-radius: 0.25rem;
        padding: 0.25rem 0.625rem;
        margin-bottom: 0.875rem;
      }
      h1 {
        font-size: 1.125rem;
        font-weight: 600;
        color: #ffffff;
        margin-bottom: 0.5rem;
      }
      p {
        font-size: 0.875rem;
        line-height: 1.5;
        color: #8ca0b8;
        margin-bottom: 1.25rem;
      }
      button {
        background-color: #172131;
        color: #2ec8ff;
        border: 1px solid rgba(46, 200, 255, 0.45);
        border-radius: 0.25rem;
        padding: 0.625rem 1.25rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        cursor: pointer;
      }
      button:hover {
        background-color: #243246;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="badge">ECAM // BAĞLANTI YOK</div>
      <h1>Çevrimdışısınız</h1>
      <p>
        İnternet bağlantısı kurulamadı ve bu sayfa için önbellekte kayıtlı veri
        bulunamadı. Bağlantınızı kontrol edip tekrar deneyin.
      </p>
      <button type="button" onclick="window.location.reload()">
        Tekrar dene
      </button>
    </main>
  </body>
</html>
