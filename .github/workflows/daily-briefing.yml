name: Daily Briefing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GEMINI_MODEL: gemini-3.5-flash

on:
  schedule:
    - cron: '3 5 * * *'   # 08:03 Europe/Istanbul (00. dakika global yoğunluğundan kaçınır)
    - cron: '35 5 * * *'  # 08:35 TRT — ilk çalışma başarısız olursa otomatik telafi #1
    - cron: '15 6 * * *'  # 09:15 TRT — otomatik telafi #2
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dosya yazmadan ve bildirim göndermeden dene'
        type: boolean
        default: false
      date:
        description: 'Hedef tarih (YYYY-MM-DD, boş ise bugün TRT)'
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      briefing_changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ENABLE_GROUNDING: ${{ vars.ENABLE_GROUNDING || 'false' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://thebybrs.github.io/hava-brifing/' }}
          BRIEFING_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
          SKIP_IF_EXISTS: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          ALLOW_RSS_FALLBACK: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '15 6 * * *') && 'true' || 'false' }}
          NOTIFY: 'false' # bildirim commit'ten sonra gönderilir
        run: npx tsx scripts/generate-briefing.ts

      - name: Commit & push
        id: commit
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "hava-briefing-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/briefings
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(briefing): $(date -u +%F) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Notify
        if: ${{ !inputs.dry_run && steps.commit.outputs.changed == 'true' }}
        env:
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL || 'https://thebybrs.github.io/hava-brifing/' }}
        run: npx tsx scripts/generate-briefing.ts --notify-only

      - name: Notify failure
        if: ${{ failure() && (github.event_name != 'schedule' || github.event.schedule == '15 6 * * *') }}
        env:
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npx tsx scripts/notify-failure.ts

  deploy:
    needs: generate
    if: ${{ !inputs.dry_run && needs.generate.outputs.briefing_changed == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
