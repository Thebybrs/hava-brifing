name: Daily Briefing

on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC = 08:00 Europe/Istanbul (UTC+3, sabit)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dosya yazmadan ve bildirim göndermeden dene'
        type: boolean
        default: false
      date:
        description: 'Hedef tarih (YYYY-MM-DD, boş ise bugün TRT)'
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://thebybrs.github.io/hava-brifing/' }}
          BRIEFING_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
          NOTIFY: 'false' # bildirim commit'ten sonra gönderilir
        run: npx tsx scripts/generate-briefing.ts

      - name: Commit & push
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "hava-briefing-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/briefings
          if git diff --cached --quiet; then
            echo "Değişiklik yok."; exit 0
          fi
          git commit -m "chore(briefing): $(date -u +%F) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Notify
        if: ${{ !inputs.dry_run }}
        env:
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL || 'https://thebybrs.github.io/hava-brifing/' }}
        run: npx tsx scripts/generate-briefing.ts --notify-only

      - name: Notify failure
        if: failure()
        env:
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npx tsx scripts/notify-failure.ts

  deploy:
    needs: generate
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
